name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "from src.liver_segmentation.config import SegmentationConfig"
          python -c "from src.liver_segmentation.data_io import load_ct_volume, get_slice"
          python -c "from src.liver_segmentation.evaluation import dice_score, iou_score, sensitivity, specificity, hausdorff_distance"
          python -c "from src.liver_segmentation.pipeline import run_pipeline"
          python -c "from src.liver_segmentation.preprocessing import gaussian_smoothing, multi_scale_gradient"
          python -c "from src.liver_segmentation.seed_detection import detect_seed"
          python -c "from src.liver_segmentation.watershed_segmentation import apply_watershed"

          echo "All imports OK"
